name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:    

jobs:
  build-scan-validate:
    name: Build, Scan, and Validate Stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2.4.0

      - name: Validate Compose syntax
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build

      - name: Scan container image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "barq-assessment-app-01:latest"
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          scanners: 'vuln,secret'
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
      
      - name: Upload security findings to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always() 
        with:
          sarif_file: "trivy-results.sarif"

      - name: Configure runtime environment (.env)
        run: |
          cat > .env <<EOF
          PUBLIC_PORT=8080
          POSTGRES_USER=barq_app
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=barq_tasks
          EOF

      - name: Install test dependencies
        run: pip install requests

      - name: Start Docker Compose stack
        run: docker compose -p barq-assessment up -d --wait

      - name: Run end-to-end stack validation
        run: python validate.py