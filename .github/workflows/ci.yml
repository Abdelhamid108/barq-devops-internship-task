name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:    

jobs:
  compose-syntax-check:
    name: Compose Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compose install
        uses: docker/setup-compose-action@v2.4.0
      
      - name: syntax check  
        run: docker compose config --quiet
    
  compose-build-validate:
    name: Compose Image Build and validate
    needs: compose-syntax-check 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Compose install
        uses: docker/setup-compose-action@v2.4.0
      
      - name: Docker Compose build
        run: docker compose build

      - name: Image Security scan for the web app image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: "barq-assessment-app-01:latest"
          format: "table"
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"

      - name: Create .env file
        run: |
          cat > .env <<EOF
          PUBLIC_PORT=8080
          POSTGRES_USER=barq_app
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=barq_tasks
          EOF
      
      - name: Install Python dependencies
        run: pip install requests

      - name: Docker Compose up
        run: docker compose -p barq-assessment up -d --wait

      - name: Run validation
        run: python validate.py
      
      
        
  
  
      
  