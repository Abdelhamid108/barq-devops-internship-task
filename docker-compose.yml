name: barq-assessment
x-app: &app
  build: .
  init: true
  restart: unless-stopped
  env_file: ./config/app.env
  environment: &app-env
    APP_HOST: "0.0.0.0"
    APP_PORT: "8080"
    APP_MESSAGE: "Welcome to BARQ Systems"
  cpus: "0.5"
  mem_limit: "256M"
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
    interval: 5s
    timeout: 3s
    retries: 3
    start_period: 3s
  networks: [frontend, backend]
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    cpus: "0.5"
    mem_limit: "512M"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [backend]
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    container_name: redis
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "", "--appendonly", "yes"]
    cpus: "0.5"
    mem_limit: "256M"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 5
    networks: [backend]
  app-01:
    <<: *app
    container_name: app-01
    environment:
      <<: *app-env
      INSTANCE_ID: "app-01"
  app-02:
    <<: *app
    container_name: app-02
    environment:
      <<: *app-env
      INSTANCE_ID: "app-02"
  nginx:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:80/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped
    container_name: nginx
    ports: ["127.0.0.1:${PUBLIC_PORT:-8080}:80"]
    cpus: "0.25"
    mem_limit: "128M"
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      app-01:
        condition: service_healthy
      app-02:
        condition: service_healthy
    networks: [frontend]
networks:
  frontend:
  backend:
    internal: true
volumes:
  postgres-data:
  redis-data:
